<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Block Wrecker</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd3ff;font-family:'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;cursor:crosshair}
.hud{position:fixed;pointer-events:none;z-index:5}
#top{top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#lvl{background:#ffffffe6;color:#2b3550;border-radius:14px;padding:6px 16px;font-weight:900;font-size:16px;box-shadow:0 3px 0 #0002}
#barW{width:min(56vw,360px);height:18px;background:#ffffffb0;border-radius:10px;overflow:hidden;box-shadow:0 3px 0 #0002;position:relative}
#bar{height:100%;width:0;background:linear-gradient(90deg,#ff9a3c,#ff5a3c);transition:width .25s}
#barT{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#2b3550}
#bar::after{content:'';position:absolute;left:85%;top:0;bottom:0;width:2px;background:#2b355088}
#money{top:max(10px,env(safe-area-inset-top));left:12px;background:#ffffffe6;color:#2b3550;border-radius:14px;padding:6px 14px;font-weight:900;font-size:20px;box-shadow:0 3px 0 #0002}
#tools{bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}
.tool{width:76px;height:76px;border-radius:18px;background:#fff;border:4px solid #fff;box-shadow:0 5px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;position:relative;cursor:pointer;color:#2b3550}
.tool small{font-size:10px;font-weight:900;margin-top:2px}
.tool .k{position:absolute;top:3px;left:6px;font-size:10px;font-weight:900;opacity:.55}
.tool.on{border-color:#ff7a3c;transform:translateY(-4px)}
.tool.lock{filter:grayscale(.85);opacity:.75}
.tool .stock{position:absolute;top:3px;right:6px;font-size:12px;font-weight:900;color:#2b3550}
.tool .price.ok{background:#3f9a4a}
.tool .price{cursor:pointer;padding:2px 7px;z-index:2}
.tool .cd{position:absolute;inset:0;border-radius:14px;background:#2b355055;transform-origin:bottom;transform:scaleY(0)}
.tool .price{position:absolute;bottom:-9px;background:#2b3550;color:#fff;border-radius:8px;padding:1px 6px;font-size:10px;font-weight:900}
#ups{right:12px;top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.up{background:#fff;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:900;color:#2b3550;box-shadow:0 3px 0 #0002;cursor:pointer;min-width:120px}
.up b{float:right;color:#e0782a}
.up.no{opacity:.55}
#banner{top:30%;left:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:all .3s;text-align:center;color:#fff;font-size:min(13vw,72px);font-weight:900;text-shadow:0 5px 0 #c8451e,0 10px 18px #0004;white-space:nowrap}
#banner small{display:block;font-size:20px;text-shadow:0 2px 0 #c8451e}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#next{top:52%;left:50%;transform:translate(-50%,-50%);pointer-events:auto;display:none;background:#ff7a3c;color:#fff;border:0;border-radius:18px;padding:14px 34px;font-size:24px;font-weight:900;box-shadow:0 6px 0 #c8451e;cursor:pointer;font-family:inherit}
#ammo{background:#ffffffe6;border-radius:12px;padding:3px 10px;font-weight:900;color:#2b3550;font-size:14px;box-shadow:0 3px 0 #0002;letter-spacing:1px}
#retry{top:62%;left:50%;transform:translate(-50%,-50%);pointer-events:auto;display:none;background:#4d96ff;color:#fff;border:0;border-radius:18px;padding:12px 30px;font-size:22px;font-weight:900;box-shadow:0 6px 0 #2a5fb8;cursor:pointer;font-family:inherit}
#free{display:none;left:12px;top:calc(max(10px,env(safe-area-inset-top)) + 46px);pointer-events:auto;background:#ffffffcc;border:0;border-radius:10px;padding:5px 10px;font-weight:900;font-size:12px;color:#2b3550;cursor:pointer;font-family:inherit}
.quote{display:block;font-size:17px;max-width:min(90vw,560px);white-space:normal;margin:6px auto;line-height:1.3;color:#fff;text-shadow:0 2px 0 #c8451e}
.stars{font-size:44px;letter-spacing:6px;display:block;margin-top:4px;text-shadow:0 3px 0 #8a5a00}
#job{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#1b2a4a66}
#job .card{background:#fffdf6;border-radius:22px;padding:18px 22px 20px;width:min(88vw,420px);text-align:center;box-shadow:0 10px 0 #0003;border:4px solid #ffd27a}
#job .av{font-size:58px;line-height:1}
#job .who{font-weight:900;color:#2b3550;font-size:18px;margin-top:4px}
#job .say{color:#2b3550;font-size:17px;margin:10px 0 12px;line-height:1.35}
#job .rule{background:#ffe9e4;color:#c8451e;border-radius:12px;padding:8px 10px;font-weight:900;font-size:14px}
#job button{margin-top:14px;background:#ff7a3c;color:#fff;border:0;border-radius:16px;padding:12px 24px;font-size:18px;font-weight:900;box-shadow:0 5px 0 #c8451e;cursor:pointer;font-family:inherit}
#jobLine{background:#ffffffd0;border-radius:10px;padding:3px 10px;font-size:12px;font-weight:900;color:#c8451e;max-width:80vw;text-align:center}
#hint{bottom:110px;left:50%;transform:translateX(-50%);color:#2b3550;background:#ffffffcc;border-radius:12px;padding:6px 14px;font-weight:900;font-size:13px;transition:opacity .6s;white-space:nowrap}
.pop{position:fixed;pointer-events:none;color:#ffd23c;font-weight:900;font-size:18px;text-shadow:0 2px 0 #8a5a00;z-index:6;transition:transform .8s ease-out,opacity .8s;will-change:transform}
.tool svg{width:38px;height:38px}
#menu{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,#1b2a4a99,#1b2a4a55 55%,#1b2a4a99)}
#menu h1{margin:0;font-size:min(14vw,92px);line-height:.9;color:#fff;text-align:center;letter-spacing:2px;text-shadow:0 6px 0 #c8451e,0 12px 24px #0006;transform:rotate(-3deg)}
#menu h1 span{display:block;color:#ffd23c;text-shadow:0 6px 0 #b86a00,0 12px 24px #0006}
#menu .sub{color:#fff;font-weight:900;font-size:16px;text-shadow:0 2px 0 #0005;margin-bottom:8px}
.mbtn{background:#ff7a3c;color:#fff;border:0;border-radius:20px;padding:14px 40px;font-size:26px;font-weight:900;box-shadow:0 7px 0 #c8451e;cursor:pointer;font-family:inherit;min-width:240px}
.mbtn small{display:block;font-size:13px;opacity:.9}
.mbtn.b{background:#4d96ff;box-shadow:0 7px 0 #2a5fb8;font-size:20px;padding:10px 30px}
.mbtn.g{background:#ffffffdd;color:#2b3550;box-shadow:0 5px 0 #0003;font-size:14px;padding:8px 18px;min-width:0}
#grid{display:none;grid-template-columns:repeat(5,88px);gap:10px;background:#fffdf6;border-radius:22px;padding:16px;box-shadow:0 10px 0 #0003}
.lv{height:96px;border-radius:16px;background:#ffe9c8;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 #d8b48a;font-weight:900;color:#2b3550;position:relative}
.lv .av{font-size:28px}.lv .st{color:#ffb020;font-size:14px;letter-spacing:1px}.lv .n{font-size:13px}
.lv.lock{filter:grayscale(1);opacity:.5;cursor:default}
#menuB{left:12px;top:calc(max(10px,env(safe-area-inset-top)) + 46px);pointer-events:auto;background:#ffffffdd;border:0;border-radius:10px;padding:5px 12px;font-weight:900;font-size:14px;color:#2b3550;cursor:pointer;font-family:inherit}
#muteB{left:94px;top:calc(max(10px,env(safe-area-inset-top)) + 46px);pointer-events:auto;background:#ffffffdd;border:0;border-radius:10px;padding:5px 9px;font-size:14px;cursor:pointer}
#tut{display:none;top:58%;left:50%;transform:translate(-50%,-50%);background:#ff7a3c;color:#fff;font-weight:900;font-size:22px;border-radius:16px;padding:10px 22px;box-shadow:0 5px 0 #c8451e;animation:tutp 1s ease-in-out infinite;white-space:nowrap}
@keyframes tutp{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
#adShots{top:72%;left:50%;transform:translate(-50%,-50%);pointer-events:auto;display:none;background:#6bcb77;color:#fff;border:0;border-radius:16px;padding:10px 24px;font-size:18px;font-weight:900;box-shadow:0 5px 0 #3f9a4a;cursor:pointer;font-family:inherit}
#pow{display:none;width:70px;height:70px;transform:translate(-50%,-120%);align-items:center;justify-content:center;flex-direction:column}
#pow .ring{width:62px;height:62px;border-radius:50%;background:conic-gradient(#ff5a3c var(--p,0%),#ffffff66 0);-webkit-mask:radial-gradient(circle,transparent 19px,#000 20px);mask:radial-gradient(circle,transparent 19px,#000 20px);box-shadow:0 0 0 2px #fff8}
#pow span{position:absolute;font-size:10px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000a}
body.inmenu .hud{visibility:hidden}
@media (pointer:coarse){.tool .k{display:none}}
@media (max-height:520px){#menu{gap:6px}#menu h1{font-size:min(9vh,44px)}#menu .sub{display:none}.mbtn{padding:8px 26px;font-size:20px}.mbtn.b{padding:6px 20px;font-size:16px}#grid{padding:8px;gap:6px}.lv{height:60px}.lv .av{font-size:20px}}
#menu.lvopen #playB,#menu.lvopen .sub{display:none}
#menu.lvopen h1{font-size:min(9vw,54px)}
@media (max-width:560px){#grid{grid-template-columns:repeat(4,72px)}.lv{height:82px}#ups{top:auto;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 76px);right:8px}#top{top:calc(max(10px,env(safe-area-inset-top)) + 40px)}#lvl{font-size:13px;padding:4px 10px}}
@media (max-width:700px){.tool{width:62px;height:62px;font-size:24px}.up{min-width:96px;font-size:11px}#hint{font-size:11px}}
@media (max-height:480px){#lvl{font-size:12px;padding:3px 10px}#ammo{font-size:11px;padding:2px 8px}#jobLine{font-size:10px;padding:2px 8px}#barW{height:13px}#barT{font-size:10px}#top{gap:3px}
#money{font-size:14px;padding:4px 10px}#menuB,#muteB{top:calc(max(6px,env(safe-area-inset-top)) + 32px);font-size:11px;padding:3px 8px}#muteB{left:78px}
.tool{width:46px;height:46px;font-size:18px;border-width:3px;border-radius:12px}.tool svg{width:24px;height:24px}.tool small{font-size:8px}.tool .price{font-size:8px;bottom:-7px}.tool .k{display:none}
.up{min-width:0;font-size:10px;padding:4px 8px}#ups{gap:4px}
#banner{font-size:min(9vw,40px)}#banner small{font-size:13px}.stars{font-size:26px}.quote{font-size:12px}
#next,#retry{top:auto;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 104px);font-size:16px;padding:8px 22px}#adShots{top:auto;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 62px);font-size:13px;padding:6px 16px}
#hint,#tut{font-size:12px}#job .card{padding:10px 14px}#job .av{font-size:34px}#job .say{font-size:13px;margin:6px 0}#job .rule{font-size:11px}#job button{font-size:14px;padding:8px 16px;margin-top:8px}}
</style>
</head>
<body>
<div class="hud" id="money">$0</div>
<div class="hud" id="top"><div id="lvl">Level 1</div><div id="ammo"></div><div id="jobLine"></div><div id="barW"><div id="bar"></div><div id="barT">0% demolished</div></div></div>
<div class="hud" id="ups"></div>
<div class="hud" id="tools"></div>
<div class="hud" id="banner"></div><div id="flashScr" style="position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;transition:opacity .35s"></div>
<button class="hud" id="next">NEXT ▶</button><button class="hud" id="retry">RETRY ↻</button><button class="hud" id="free">∞ Free play: OFF</button>
<div class="hud" id="pow"><div class="ring"></div><span>POWER</span></div><button class="hud" id="menuB">☰ Menu</button><button class="hud" id="muteB">🔊</button><button class="hud" id="adShots">▶ Watch an ad: +3 shots</button>
<div id="menu"><h1>BLOCK<span>WRECKER</span></h1><div class="sub">Demolition jobs for very picky clients</div>
<button class="mbtn" id="playB">PLAY<small id="playL">Level 1</small></button><button class="mbtn b" id="levelsB">LEVELS</button><div id="grid"></div>
<div style="display:flex;gap:8px"><button class="mbtn g" id="freeB">∞ Free play: OFF</button><button class="mbtn g" id="muteM">🔊</button></div></div>
<div id="job"><div class="card"><div class="av" id="jobAv"></div><div class="who" id="jobWho"></div><div class="say" id="jobSay"></div><div class="rule" id="jobRule"></div><button id="jobGo">OK, LET'S WRECK IT</button></div></div>
<div class="hud" id="tut">HOLD to charge… then RELEASE!</div><div class="hud" id="hint" style="opacity:0">Hold to charge the cannon, release to fire · drag to look around</div>
<script type="module" src="./game.js"></script>
</body>
</html>
